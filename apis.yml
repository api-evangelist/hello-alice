name: Hello Alice
description: 'Hello Alice is a free, multichannel digital platform that helps small business
  owners start, grow, and fund their businesses. Founded in 2017 by Carolyn Rodz and Elizabeth
  Gore, it connects millions of entrepreneurs to capital (grants and loans), a peer network,
  business-health tools, and educational resources, and partners with enterprises, financial
  institutions, and government programs to distribute grant funding and support to underserved
  small business owners. Backed by QED Investors among others. The company operates a consumer
  web application at helloalice.com; no public developer API or documented API program was found
  during enrichment.'
